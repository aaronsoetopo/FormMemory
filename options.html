<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>FormMemory – Options</title>
  <style>
    :root { --bg: #f6f5f1; --surface: #fff; --text: #16181b; --muted: #4f565e; --border: #d6d3c8; --accent: #0b5d57; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111315; --surface: #1a1d20; --text: #eef0f2; --muted: #aab1b9; --border: #2f353b; --accent: #72d6ca; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 640px; margin: 48px auto; padding: 0 20px; }
    h1 { margin: 0 0 8px; letter-spacing: -0.02em; }
    section { margin-top: 28px; padding: 22px 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
    h2 { margin: 0 0 6px; font-size: 18px; }
    p { margin: 0 0 14px; color: var(--muted); }
    button { font: inherit; font-size: 14px; font-weight: 600; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 16px; cursor: pointer; }
    button:hover { border-color: var(--muted); }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    button:disabled { opacity: 0.5; cursor: wait; }
    #status { margin: 14px 0 0; min-height: 1.5em; color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>FormMemory Options</h1>
    <p>API keys and privacy settings will go here.</p>

    <section id="demo-section">
      <h2>Demo data</h2>
      <p>Load 12 fake entries across 4 forms to try out the history page. Demo entries are tagged “Demo”, and clearing them never touches your real entries.</p>
      <button type="button" id="load-demo">Load demo data</button>
      <button type="button" id="clear-demo">Clear demo data</button>
      <p id="status" role="status"></p>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
